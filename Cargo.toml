[package]
name = "tail-win"
version = "1.0.0-beta.1"
edition = "2024"
rust-version = "1.85"
description = "A native Windows port of GNU tail (clean-room, behavior-compatible)"
license = "MIT"
repository = "https://github.com/badbat75/tail.win64"

[lib]
name = "tail_win"
path = "src/lib.rs"

[[bin]]
name = "tail"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
glob = "0.3"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
