[package]
name = "tail-win"
version = "1.0.0-beta.2"
edition = "2024"
rust-version = "1.85"
description = "A native Windows port of GNU tail (clean-room, behavior-compatible)"
license = "MIT"
repository = "https://github.com/badbat75/tail.win64"

# MSIX package version for the beta builds (read by packaging/msix/build-msix.ps1).
# Beta 1 reached the Store as 1.0.0.0 and Store versions can never go down, so
# beta N ships as 1.0.N.0 (the fourth field is reserved by the Store). Without
# this override the package version is major.minor.patch.0 of the crate version,
# so the next release must also sort above the last beta.
[package.metadata.msix]
version = "1.0.2.0"

[lib]
name = "tail_win"
path = "src/lib.rs"

[[bin]]
name = "tail"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
glob = "0.3"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
